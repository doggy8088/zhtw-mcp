<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>字正腔圓</title>
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body>
    <main class="panel">
      <section class="hero" aria-label="掃描摘要">
        <p class="eyebrow">zhtw-mcp</p>
        <h1>正體用語檢查</h1>
        <div class="meter">
          <span id="count" class="meter__count">—</span>
          <span class="meter__label">警告 / 錯誤</span>
        </div>
        <p id="status" class="status" data-tone="idle">尚未掃描</p>
        <button id="scan-button" type="submit" form="scan-form">檢查目前分頁</button>
      </section>

      <form id="scan-form" class="controls">
        <details class="settings">
          <summary>選項設定</summary>
          <div class="settings__body">
            <label class="field">
              <span>檢查強度</span>
              <select id="profile">
                <option value="base">Base：用語、標點、文法</option>
                <option value="strict">Strict：加入字形標準</option>
              </select>
            </label>
            <label class="field">
              <span>中文與英數字間距</span>
              <select id="spacing">
                <option value="require">Require：中文與英數字之間加空格</option>
                <option value="strip">Strip：移除空格，交給網頁排版</option>
              </select>
            </label>
            <label class="toggle">
              <input id="relaxed" type="checkbox" />
              <span>UI 文案模式：放寬部分標點與文法規則</span>
            </label>
            <label class="field">
              <span>輸入欄連續符號</span>
              <select id="symbol-handling">
                <option value="warn">Warn：顯示提醒</option>
                <option value="remove">Remove：移除非功能性符號</option>
                <option value="off">Off：不處理</option>
              </select>
            </label>
            <label class="field">
              <span>停用的規則家族（可複選）</span>
              <select id="off" multiple size="5">
                <option value="spelling">用語與詞彙 (spelling)</option>
                <option value="casing">專有名詞大小寫 (casing)</option>
                <option value="punctuation">半形標點 (punctuation)</option>
                <option value="quotes">引號轉換 (quotes)</option>
                <option value="spacing">中文與英數字間距 (spacing)</option>
                <option value="colon">全形冒號 (colon)</option>
                <option value="dunhao">頓號 (dunhao)</option>
                <option value="range">範圍符號 (range)</option>
                <option value="variant">異體字 (variant)</option>
                <option value="ellipsis">刪節號 (ellipsis)</option>
                <option value="grammar">文法 (grammar)</option>
                <option value="ai">AI 語感 (ai)</option>
                <option value="translationese">翻譯腔 (translationese)</option>
                <option value="rhythm">氣口 (rhythm)</option>
              </select>
            </label>
          </div>
        </details>
      </form>

      <ol id="issue-list" class="issues" aria-label="掃描結果"></ol>
    </main>
    <script type="module" src="src/popup.js"></script>
  </body>
</html>
